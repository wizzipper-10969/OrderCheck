<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>ChatOrder — ระบบออเดอร์แชท B&amp;P</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
  :root{
    --bg:#eef1f6;
    --surface:rgba(255,255,255,.66);
    --surface2:rgba(255,255,255,.42);
    --border:rgba(255,255,255,.55);
    --accent:#e08a00;
    --accent-2:#ff7a1a;
    --success:#1f9d5c;
    --success-dim:rgba(31,157,92,.14);
    --danger:#e5484d;
    --danger-dim:rgba(229,72,77,.14);
    --info:#2f7ee0;
    --info-dim:rgba(47,126,224,.14);
    --purple:#8b5cf6;
    --purple-dim:rgba(139,92,246,.14);
    --text:#1b2430;
    --muted:#5b6672;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --disp:'Oswald',sans-serif;
    --body:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 8% 8%, rgba(255,167,53,.32), transparent 42%),
      radial-gradient(circle at 92% 18%, rgba(255,122,26,.25), transparent 45%),
      radial-gradient(circle at 15% 85%, rgba(96,165,250,.22), transparent 45%),
      radial-gradient(circle at 90% 92%, rgba(167,139,250,.20), transparent 45%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:var(--body);
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:78px;
  }
  #app{max-width:560px;margin:0 auto;min-height:100vh;position:relative;}
  .stripes{height:8px;width:100%;background:repeating-linear-gradient(90deg,var(--accent) 0 3px, transparent 3px 6px, var(--accent-2) 6px 8px, transparent 8px 13px, var(--accent) 13px 16px, transparent 16px 22px);opacity:.9;}
  header.top{padding:16px 16px 12px;background:var(--surface);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:40;}
  header.top .brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  header.top .brand{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:baseline;gap:7px;}
  header.top .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);align-self:center;}
  header.top .brand .by{font-family:var(--body);font-weight:500;font-size:11px;text-transform:none;color:var(--muted);}
  header.top .sub{color:var(--muted);font-size:12.5px;margin-top:2px;}
  .staff-badge{flex-shrink:0;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-weight:600;font-size:12px;padding:7px 11px;border-radius:20px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;max-width:130px;}
  .staff-badge span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  main{padding:14px 14px 20px;}

  h2.section-title{font-family:var(--disp);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.3px;margin:0 0 10px;color:var(--text);}
  .muted{color:var(--muted);}
  .card{background:var(--surface);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(31,45,61,.06);}
  label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:10px 0 5px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=number],input[type=tel],textarea,select{
    width:100%;padding:11px 12px;border-radius:11px;border:1px solid rgba(0,0,0,.12);background:rgba(255,255,255,.85);
    font-family:var(--body);font-size:15px;color:var(--text);margin-bottom:2px;
  }
  textarea{resize:vertical;min-height:56px;}
  select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0 L5 6 L10 0 Z' fill='%235b6672'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:30px;}
  .row{display:flex;gap:8px;}
  .row > *{flex:1;min-width:0;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:12px;border:none;font-family:var(--body);font-weight:700;font-size:14.5px;cursor:pointer;width:100%;}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;box-shadow:0 6px 16px rgba(224,138,0,.35);}
  .btn-secondary{background:var(--surface2);border:1px solid var(--border);color:var(--text);}
  .btn-danger{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(229,72,77,.3);}
  .btn-ghost{background:none;border:1.5px dashed rgba(0,0,0,.18);color:var(--muted);}
  .btn:active{transform:scale(.97);}
  .btn-sm{padding:8px 12px;font-size:13px;width:auto;}

  .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:700;font-family:var(--body);}
  .badge-cod{background:var(--danger-dim);color:var(--danger);}
  .badge-paid{background:var(--success-dim);color:var(--success);}
  .badge-credit{background:var(--info-dim);color:var(--info);}
  .badge-gift{background:var(--purple-dim);color:var(--purple);}
  .badge-rs{background:var(--warn-dim,rgba(224,138,0,.16));color:var(--accent);}
  .badge-other{background:var(--surface2);color:var(--muted);}
  .badge-status{background:rgba(0,0,0,.06);color:var(--muted);}
  .badge-status-pending{background:rgba(224,138,0,.14);color:var(--accent);}
  .badge-status-transit{background:var(--info-dim);color:var(--info);}
  .badge-status-delivered{background:var(--success-dim);color:var(--success);}
  .badge-status-problem{background:var(--danger-dim);color:var(--danger);}
  .badge-status-cancelled{background:rgba(0,0,0,.08);color:var(--muted);}
  .carrier-ic{height:14px;width:14px;object-fit:contain;border-radius:3px;vertical-align:-2px;margin-right:3px;}
  .phone-hint{font-size:11.5px;margin:-2px 0 8px;min-height:14px;line-height:1.4;}
  .phone-hint a{color:var(--accent);font-weight:700;}

  .order-card{display:flex;flex-direction:column;gap:6px;}
  .order-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .order-card .oid{font-family:var(--mono);font-weight:700;font-size:13px;color:var(--accent);}
  .order-card .cust{font-weight:700;font-size:15.5px;}
  .order-card .meta{font-size:12.5px;color:var(--muted);line-height:1.5;}
  .order-card .amount{font-family:var(--disp);font-weight:700;font-size:18px;}
  .order-card .actions{display:flex;gap:6px;margin-top:6px;}
  .order-card .actions .btn{flex:1;}

  .item-row{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:9px 10px;margin-bottom:7px;}
  .item-row .thumb{width:38px;height:38px;border-radius:6px;object-fit:cover;flex-shrink:0;background:#fff;border:1px solid var(--border);}
  .item-row .thumb-ph{width:38px;height:38px;border-radius:6px;flex-shrink:0;background:#fff;border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--muted);}
  .item-row .info{flex:1;min-width:0;cursor:pointer;}
  .item-row .info .nm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-row .info .cd{font-family:var(--mono);font-size:11.5px;color:var(--muted);}
  .item-row .info.empty .nm{color:var(--accent);}
  .item-row input.qty{flex:0 0 46px;text-align:center;padding:8px 4px;margin-bottom:0;font-size:14px;}
  .item-row input.custom-name{flex:1;min-width:0;padding:8px 10px;margin-bottom:0;font-size:13px;font-weight:600;}
  .item-row input.price{flex:0 0 64px;text-align:center;padding:8px 4px;margin-bottom:0;font-size:13px;}
  .item-row .rm{flex:0 0 auto;background:none;border:1px solid var(--border);border-radius:9px;width:34px;height:34px;font-size:14px;color:var(--danger);cursor:pointer;}
  .add-item-btn{background:none;border:1.5px dashed rgba(0,0,0,.18);border-radius:13px;color:var(--accent);font-family:var(--disp);font-weight:600;font-size:12.5px;text-transform:uppercase;padding:10px;width:100%;cursor:pointer;margin:2px 0 10px;}

  .summary-bar{display:flex;gap:8px;margin-bottom:12px;}
  .summary-bar .box{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 8px;text-align:center;}
  .summary-bar .box .n{font-family:var(--disp);font-weight:700;font-size:16px;}
  .summary-bar .box .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}

  .modal-overlay{display:none;position:fixed;inset:0;z-index:200;background:rgba(20,25,35,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:16px;}
  .modal-overlay.show{display:flex;}
  .modal-card{width:100%;max-width:400px;max-height:88vh;overflow-y:auto;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.6);border-radius:20px;padding:18px;box-shadow:0 20px 50px rgba(15,25,40,.28);}
  .modal-title{font-family:var(--disp);font-weight:700;font-size:16.5px;text-transform:uppercase;margin-bottom:4px;}
  .modal-desc{font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:12px;}
  .modal-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:20px;color:var(--muted);cursor:pointer;}

  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.82);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);border-top:1px solid var(--border);display:flex;max-width:560px;margin:0 auto;}
  .navbtn{flex:1;background:none;border:none;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--muted);font-size:10.5px;font-weight:600;}
  .navbtn .ic{font-size:19px;}
  .navbtn.active{color:var(--accent);}

  .toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);background:rgba(27,36,48,.92);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:500;z-index:400;opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .empty-state{text-align:center;padding:40px 16px;color:var(--muted);}
  .empty-state .ic{font-size:38px;margin-bottom:8px;}

  .search-box{position:relative;margin-bottom:12px;}
  .search-box input{padding-left:34px;}
  .search-box .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;}

  .pick-list{max-height:52vh;overflow-y:auto;margin-bottom:4px;}
  .pick-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid rgba(0,0,0,.06);cursor:pointer;}
  .pick-row:active{background:rgba(0,0,0,.04);}
  .pick-row .thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;flex-shrink:0;background:#f2f2f2;border:1px solid var(--border);}
  .pick-row .thumb-ph{width:36px;height:36px;border-radius:6px;flex-shrink:0;background:#f2f2f2;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted);}
  .pick-row .nm{font-size:13.5px;font-weight:600;}
  .pick-row .cd{font-family:var(--mono);font-size:11px;color:var(--muted);}
  .pick-row .pr{margin-left:auto;font-weight:700;font-size:13px;color:var(--accent);flex-shrink:0;}
  .set-tag{display:inline-block;background:var(--purple-dim);color:var(--purple);font-size:9.5px;font-weight:700;border-radius:5px;padding:1px 5px;margin-left:5px;vertical-align:middle;}

  /* ---- label preview + print (portrait 75mm wide x 100mm tall) ---- */
  .label-wrap{display:flex;justify-content:center;margin-bottom:14px;overflow:hidden;}
  .label{
    width:75mm;height:100mm;background:#fff;color:#000;padding:3.5mm 4mm 3mm;
    font-family:var(--body);box-shadow:0 4px 20px rgba(0,0,0,.18);position:relative;overflow:hidden;
    display:flex;flex-direction:column;box-sizing:border-box;
    transform:scale(1.25);transform-origin:top center;margin-bottom:25mm;
  }
  .label .lb-top{display:flex;justify-content:space-between;align-items:flex-start;flex:0 0 auto;}
  .label .lb-logo{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;}
  .label .lb-logo img{height:10mm;width:auto;display:block;object-fit:contain;}
  .label .lb-logo .sub{font-size:6.5px;letter-spacing:1.3px;text-transform:uppercase;text-align:left;margin-top:1px;font-weight:600;}
  .label .lb-printdate{font-size:7.5px;font-weight:600;white-space:nowrap;}
  .label .lb-rule{border:none;border-top:1.3px solid #000;margin:2mm 0;flex:0 0 auto;width:100%;}
  .label .lb-date{font-family:var(--disp);font-weight:700;font-size:16px;text-align:center;flex:0 0 auto;}
  .label .lb-cust{font-family:var(--disp);font-weight:700;font-size:16px;margin-top:1mm;flex:0 0 auto;word-break:break-word;}
  .label .lb-phone{font-family:var(--disp);font-weight:700;font-size:13.5px;line-height:1.3;flex:0 0 auto;word-break:break-word;}
  .label .lb-addr{font-size:13.5px;line-height:1.5;margin-top:1.5mm;flex:0 0 auto;word-break:break-word;}
  .label .lb-note{font-size:10px;line-height:1.42;font-weight:600;margin-top:1mm;flex:0 0 auto;word-break:break-word;}
  .label .lb-spacer{flex:1 1 auto;min-height:2mm;}
  .label .lb-bottom{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;border-top:2px solid #000;padding-top:2.2mm;margin-bottom:2mm;}
  .label .lb-type{font-family:var(--disp);font-weight:700;font-size:19px;letter-spacing:.5px;}
  .label .lb-amount{font-family:var(--disp);font-weight:700;font-size:32px;line-height:1;}
  .label .lb-barwrap{flex:0 0 auto;text-align:center;width:100%;}
  .label .lb-barwrap svg{height:14mm;width:14mm;max-width:45%;display:block;margin:0 auto;shape-rendering:crispEdges;}
  .label .lb-barwrap .oid-txt{font-family:var(--mono);font-size:7px;letter-spacing:.5px;margin-top:1mm;}

  @media print{
    #app, #modal-overlay, #toast{ display:none !important; }
    html,body{ margin:0 !important; padding:0 !important; min-height:0 !important; height:auto !important; background:none !important; }
    #print-label-area{ position:static !important; left:0 !important; top:0 !important; margin:0 !important; }
    .label{transform:none;box-shadow:none;margin:0;}
    @page{ size:75mm 100mm; margin:0; }
  }
</style>

  <div class="stripes"></div>
  <header class="top">
    <div class="brand-row">
      <div>
        <div class="brand"><span class="dot"></span>ChatOrder<span class="by">by B&amp;P</span></div>

<div class="toast" id="toast"></div>

<script>
/* ============ FIREBASE — reuses the SAME project as the PackCheck app so
   the product/set catalog is shared live between both sites. Orders are
   stored under a separate "corder:" key prefix so this app's richer order
   schema (customer/phone/address/payment/shipping) never collides with
   PackCheck's own "order:" packing-check records. ============ */
const firebaseConfig = {
  apiKey: "AIzaSyCT8RBUMuyJTdmMD2gXUo3kZSppZumEBSA",
  authDomain: "pack-check-1706d.firebaseapp.com",
  projectId: "pack-check-1706d",
  storageBucket: "pack-check-1706d.firebasestorage.app",
  messagingSenderId: "797522845440",
  appId: "1:797522845440:web:d2c169251e1a1c47e3dde5"
};
let db = null, backendReady = false;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  backendReady = true;
}catch(e){ console.error('firebase init failed', e); backendReady = false; }

function sanitizeDocId(key){ return String(key).replace(/\//g,'_').slice(0,1500) || '_'; }
async function rawGet(key){ if(!backendReady) return null; const d = await db.collection('packcheck').doc(sanitizeDocId(key)).get(); return d.exists ? d.data().value : null; }
async function rawSet(key, value){ if(!backendReady) throw new Error('backend not configured'); await db.collection('packcheck').doc(sanitizeDocId(key)).set({ value, updatedAt: Date.now() }); return true; }
async function rawList(prefix){ if(!backendReady) return []; const snap = await db.collection('packcheck').orderBy(firebase.firestore.FieldPath.documentId()).startAt(prefix).endAt(prefix+'\uf8ff').get(); return snap.docs.map(d=>d.id); }
async function rawDelete(key){ if(!backendReady) return; await db.collection('packcheck').doc(sanitizeDocId(key)).delete(); }
async function sGet(key){ try{ return await rawGet(key); }catch(e){ console.error(e); return null; } }
async function sSet(key,value){ try{ return await rawSet(key,value); }catch(e){ console.error(e); return null; } }
async function sList(prefix){ try{ return await rawList(prefix); }catch(e){ console.error(e); return []; } }
async function sDelete(key){ try{ await rawDelete(key); }catch(e){ console.error(e); } }
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
async function sSetWithRetry(key,value,maxRetries){
  maxRetries = maxRetries||6; let attempt=0;
  while(attempt<=maxRetries){
    try{ return await rawSet(key,value); }
    catch(e){ attempt++; if(attempt>maxRetries){ console.error('give up',key,e); return null; } await sleep(350*attempt); }
  }
}
async function sGetWithRetry(key,maxRetries){
  maxRetries = maxRetries||4; let attempt=0;
  while(attempt<=maxRetries){
    try{ return await rawGet(key); }
    catch(e){ attempt++; if(attempt>maxRetries) return null; await sleep(300*attempt); }
  }
}
async function mapWithConcurrency(items, limit, fn){
  const results = new Array(items.length); let i=0;
  async function worker(){ while(i<items.length){ const idx=i++; results[idx]=await fn(items[idx],idx); } }
  await Promise.all(Array.from({length:Math.min(limit,items.length)}, worker));
  return results;
}

/* ============ UTIL ============ */
function todayStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function fmtDateTH(dstr){
  if(!dstr) return '-';
  const [y,m,d] = dstr.split('-').map(Number);
  const months=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return d+' '+months[m-1]+' '+(y+543);
}
function fmtDateSlash(dstr){ if(!dstr) return '-'; const [y,m,d]=dstr.split('-'); return d+'/'+m+'/'+y; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function sanitizeKeyPart(s){ return String(s==null?'':s).trim().replace(/[\s\/\\'"]+/g,'_').slice(0,120); }
function money(n){ n=Number(n)||0; return n.toLocaleString('th-TH',{maximumFractionDigits:0}); }
let toastTimer=null;
function toast(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'), 2400);
}
function closeModal(){ document.getElementById('modal-overlay').classList.remove('show'); document.getElementById('modal-overlay').innerHTML=''; }
function showModal(html){ const ov=document.getElementById('modal-overlay'); ov.innerHTML = '<div class="modal-card">'+html+'</div>'; ov.classList.add('show'); ov.onclick=(e)=>{ if(e.target===ov) closeModal(); }; }

const State = {
  tab:'orders', staffName:'',
  date: todayStr(), dates:[], orders:[], search:'',
  catalog:[], catalogByCode:{}, photoCache:{},
  orderForm:null,      // draft when creating/editing an order
  pickerTarget:null,   // which item-row index the product picker is filling
  scanActive:false, html5Qr:null, scanCooldown:false,
  brand: { name:'B&P', sub:'B&P COMPANY' },
  exportMonth: (()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); })(),
  exportSummary: null
};

/* ============ STAFF NAME (local to this device, like PackCheck) ============ */
function loadStaffName(){ State.staffName = localStorage.getItem('co_staffName') || ''; document.getElementById('staff-badge-name').textContent = State.staffName || 'ตั้งชื่อ'; }
function openStaffModal(){
  showModal(`
    <div class="modal-title">ชื่อผู้ใช้งาน</div>
    <div class="modal-desc">ใช้บันทึกว่าใครเป็นคนสร้าง/แก้ไขออเดอร์นี้ (บันทึกไว้ในเครื่องนี้เท่านั้น)</div>
    <label>ชื่อของคุณ</label>
    <input type="text" id="staff-input" value="${esc(State.staffName)}" placeholder="เช่น น้องเอ">
    <div class="row" style="margin-top:12px">
      <button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button>
      <button class="btn btn-primary" onclick="saveStaffName()">บันทึก</button>
    </div>`);
  setTimeout(()=>document.getElementById('staff-input')?.focus(), 50);
}
function saveStaffName(){
  const v = document.getElementById('staff-input').value.trim();
  if(!v){ toast('กรุณาใส่ชื่อ'); return; }
  State.staffName = v; localStorage.setItem('co_staffName', v);
  document.getElementById('staff-badge-name').textContent = v;
  closeModal(); toast('บันทึกชื่อแล้ว');
}

/* ============ CATALOG (shared "set:" collection — same data PackCheck uses) ============ */
function normName(s){ return String(s||'').trim().toLowerCase(); }
function normalizeSetDef(def){ if(!def.matchBy){ def.matchBy='code'; def.matchValue=def.code||''; } if(!('matchValue' in def)) def.matchValue = def.code||''; return def; }

async function refreshCatalog(){
  const keys = await sList('set:');
  const results = await mapWithConcurrency(keys, 6, async k=>{
    const v = await sGetWithRetry(k); if(!v) return null;
    try{ return normalizeSetDef(JSON.parse(v)); }catch(e){ return null; }
  });
  const defs = results.filter(Boolean).filter(d=>d.matchBy==='code' && d.matchValue);

  const priceKeys = await sList('price:');
  const priceResults = await mapWithConcurrency(priceKeys, 6, async k=>{
    const v = await sGetWithRetry(k); if(!v) return null;
    try{ return JSON.parse(v); }catch(e){ return null; }
  });
  const priceMap = {};
  priceResults.filter(Boolean).forEach(p=>{ if(p && p.code) priceMap[p.code] = p; });

  const list = defs.map(d=>({
    code: d.matchValue, name: d.name || d.matchValue,
    components: d.components || [],
    isSet: (d.components||[]).length>1 || ((d.components||[]).length===1 && d.components[0].code!==d.matchValue),
    price: priceMap[d.matchValue] ? Number(priceMap[d.matchValue].price)||0 : 0,
    stock: priceMap[d.matchValue] ? priceMap[d.matchValue].stock : null
  }));
  list.sort((a,b)=>a.name.localeCompare(b.name,'th'));
  State.catalog = list;
  State.catalogByCode = {}; list.forEach(it=>State.catalogByCode[it.code]=it);

  const toLoad = list.filter(it=>!(it.code in State.photoCache));
  await mapWithConcurrency(toLoad, 6, async it=>{
    const v = await sGetWithRetry('photo:'+sanitizeKeyPart(it.code));
    State.photoCache[it.code] = v || null;
  });
}

/* import the wide TikTok-style product export (same file format used by the PackCheck
   "ตั้งค่าเซท" importer) — writes back to the SHARED "set:" catalog so PackCheck also
   sees any new products, and additionally saves price/stock under "price:<code>" which
   PackCheck doesn't use but this order app needs for auto totals. */
async function importCatalogFromFile(file){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(new Uint8Array(buf), {type:'array'});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows2d = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
  if(!rows2d.length){ toast('ไม่พบข้อมูลในไฟล์'); return; }
  const headerRow = rows2d[0].map(h=>String(h||'').trim());
  const dataRows = rows2d.slice(1).filter(r=>r.some(c=>String(c||'').trim()!==''));
  const isWide = headerRow.some(h=>h.includes('ในเซทประกอบด้วย')) && headerRow.some(h=>h.includes('Product ID'));
  if(!isWide){ toast('ไฟล์นี้ไม่ตรงรูปแบบไฟล์รายการสินค้า (ต้องเป็นไฟล์ export แบบเดียวกับที่ใช้ในเว็บเช็คแพ็ค)'); return; }

  const nameByCode = {}, priceByCode = {}, stockByCode = {};
  dataRows.forEach(r=>{
    const name=String(r[0]||'').trim(), option=String(r[2]||'').trim(), sku=String(r[3]||'').trim();
    if(!sku) return;
    nameByCode[sku] = option ? name+' ('+option+')' : name;
    stockByCode[sku] = r[4]!=='' ? Number(r[4])||0 : null;
    priceByCode[sku] = r[5]!=='' ? Number(r[5])||0 : 0;
  });

  const defs = [];
  dataRows.forEach(r=>{
    const sku=String(r[3]||'').trim(); if(!sku) return;
    const ownName = nameByCode[sku]||sku;
    const comps=[];
    for(let slot=0; slot<5; slot++){
      const base=6+slot*3; const compSku=String(r[base+1]||'').trim();
      if(!compSku) continue;
      let qty=parseInt(r[base+2]); if(isNaN(qty)||qty<=0) qty=1;
      comps.push({ code:compSku, name:nameByCode[compSku]||compSku, qty });
    }
    if(comps.length===0) comps.push({ code:sku, name:ownName, qty:1 });
    defs.push({ matchBy:'code', matchValue:sku, name:ownName, components:comps, price:priceByCode[sku]||0, stock:stockByCode[sku] });
  });

  let done=0;
  for(const def of defs){
    const key = 'set:code:'+sanitizeKeyPart(def.matchValue);
    await sSetWithRetry(key, JSON.stringify({ matchBy:def.matchBy, matchValue:def.matchValue, name:def.name, components:def.components }));
    await sSetWithRetry('price:'+sanitizeKeyPart(def.matchValue), JSON.stringify({ code:def.matchValue, price:def.price, stock:def.stock }));
    done++;
    await sleep(120);
  }
  toast('นำเข้าสินค้าสำเร็จ '+done+' รายการ (ใช้ร่วมกับเว็บเช็คแพ็คได้ทันที)');
  await refreshCatalog();
}

/* ============ ORDERS ("corder:" prefix — separate from PackCheck's own "order:") ============ */
async function loadDateIndexC(){
  const raw = await sGet('codateindex'); let arr=[];
  try{ arr = raw?JSON.parse(raw):[]; }catch(e){ arr=[]; }
  arr.sort().reverse(); State.dates = arr; return arr;
}
async function addDateToIndexC(date){
  const raw = await sGet('codateindex'); let arr=[];
  try{ arr = raw?JSON.parse(raw):[]; }catch(e){ arr=[]; }
  if(!arr.includes(date)){ arr.push(date); await sSet('codateindex', JSON.stringify(arr)); }
}
function orderKeyC(date, orderId){ return 'corder:'+date+':'+sanitizeKeyPart(orderId); }
async function loadOrdersForDateC(date){
  const keys = await sList('corder:'+date+':');
  const results = await mapWithConcurrency(keys, 6, async k=>{
    const v = await sGetWithRetry(k); if(!v) return null;
    try{ return JSON.parse(v); }catch(e){ return null; }
  });
  const orders = results.filter(Boolean);
  orders.sort((a,b)=>a.orderId.localeCompare(b.orderId));
  return orders;
}
async function nextOrderId(date){
  const orders = await loadOrdersForDateC(date);
  let n = orders.length+1;
  let id = 'OD'+String(n).padStart(3,'0');
  while(orders.some(o=>o.orderId===id)){ n++; id='OD'+String(n).padStart(3,'0'); }
  return id;
}
async function saveOrderC(order){
  order.updatedAt = Date.now();
  await sSetWithRetry(orderKeyC(order.date, order.orderId), JSON.stringify(order));
  await addDateToIndexC(order.date);
  await saveCustomerProfile(order);
}
async function deleteOrderC(date, orderId){ await sDelete(orderKeyC(date, orderId)); }

/* ============ CUSTOMER MEMORY (lookup returning customers by phone) ============ */
function customerKeyFromPhone(phone){
  const digits = String(phone||'').replace(/\D/g,'');
  return digits.length>=7 ? 'ccustomer:'+digits : null;
}
async function saveCustomerProfile(order){
  const key = customerKeyFromPhone(order.phone);
  if(!key || !order.customer) return;
  await sSetWithRetry(key, JSON.stringify({ customer: order.customer, address: order.address||'', updatedAt: Date.now() }));
}
async function lookupCustomerProfile(phone){
  const key = customerKeyFromPhone(phone);
  if(!key) return null;
  const raw = await sGet(key);
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}

function orderItemsTotal(items){ return (items||[]).reduce((s,it)=>s+ (Number(it.price)||0)*(Number(it.qty)||0), 0); }
function orderDisplayAmount(o){
  if(o.orderType==='COD') return o.codAmount!=null ? o.codAmount : orderItemsTotal(o.items);
  if(o.orderType==='PAID' || o.orderType==='CREDIT') return o.paidAmount!=null ? o.paidAmount : orderItemsTotal(o.items);
  return orderItemsTotal(o.items);
}

/* ============ DAILY PRODUCT-OUT SUMMARY (excludes the shipping-fee line) ============ */
function buildDailyProductSummary(orders){
  const map = {};
  (orders||[]).forEach(o=>{
    (o.items||[]).forEach(it=>{
      if(it.isFee || it.code===SHIPPING_FEE_CODE || !it.code) return;
      if(!map[it.code]) map[it.code] = { code:it.code, name: it.name||it.code, qty:0 };
      map[it.code].qty += Number(it.qty)||0;
    });
  });
  return Object.values(map).sort((a,b)=>b.qty-a.qty);
}
async function openDailySummary(){
  const orders = State.orders || [];
  const summary = buildDailyProductSummary(orders);
  const totalPieces = summary.reduce((s,it)=>s+it.qty,0);
  showModal(`
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title">สรุปสินค้าที่ส่งออก</div>
    <div class="modal-desc">${fmtDateTH(State.date)} — ${orders.length} ออเดอร์ &nbsp;·&nbsp; รวม ${totalPieces} ชิ้น (ไม่รวมค่าส่ง)</div>
    <div class="pick-list">
      ${summary.length ? summary.map(it=>{
        const photo = State.photoCache[it.code];
        const thumb = photo ? `<img class="thumb" src="${photo}">` : `<div class="thumb-ph">📦</div>`;
        return `<div class="pick-row" style="cursor:default">${thumb}<div><div class="nm">${esc(it.name)}</div><div class="cd">${esc(it.code)}</div></div><div class="pr">${it.qty} ชิ้น</div></div>`;
      }).join('') : `<div class="empty-state" style="padding:20px"><div class="ic">📭</div>ยังไม่มีสินค้าที่ส่งในวันนี้</div>`}
    </div>
    <div class="row"><button class="btn btn-secondary" onclick="closeModal()">ปิด</button></div>
  `);
}

/* ---- phone lookup: autofill returning customer's name/address ---- */
let phoneLookupTimer = null;
let lastLookupProfile = null;
function onPhoneInputChange(val){
  fUpd('phone', val);
  clearTimeout(phoneLookupTimer);
  lastLookupProfile = null;
  const hintEl = document.getElementById('phone-lookup-hint');
  if(hintEl) hintEl.textContent = '';
  const digits = String(val||'').replace(/\D/g,'');
  if(digits.length < 9) return;
  phoneLookupTimer = setTimeout(async ()=>{
    const profile = await lookupCustomerProfile(val);
    const hEl = document.getElementById('phone-lookup-hint');
    if(!profile) return;
    lastLookupProfile = profile;
    const f = State.orderForm;
    if(f && !(f.customer||'').trim() && !(f.address||'').trim()){
      f.customer = profile.customer||''; f.address = profile.address||'';
      const cEl = document.getElementById('f-customer'); if(cEl) cEl.value = f.customer;
      const aEl = document.getElementById('f-address'); if(aEl) aEl.value = f.address;
      if(hEl) hEl.innerHTML = '✅ พบลูกค้าเดิม "'+esc(profile.customer||'')+'" — เติมชื่อ/ที่อยู่ให้อัตโนมัติ';
    } else if(hEl){

async function toggleScanCamera(){
  const reader = document.getElementById('reader');
  const btn = document.getElementById('cam-btn');
  if(State.scanActive){
    if(State.html5Qr){ try{ await State.html5Qr.stop(); await State.html5Qr.clear(); }catch(e){} }
    State.scanActive=false; reader.style.display='none'; btn.textContent='📷 เปิดกล้องสแกน';
    return;
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('เบราว์เซอร์นี้ไม่รองรับกล้อง กรุณาพิมพ์รหัสแทน'); return; }
  if(typeof Html5Qrcode==='undefined'){ toast('โหลดตัวสแกนไม่สำเร็จ กรุณาพิมพ์รหัสแทน'); return; }
  reader.style.display='block'; State.scanActive=true; btn.textContent='⏹ ปิดกล้อง';
  try{
    State.html5Qr = new Html5Qrcode('reader');
    await State.html5Qr.start({facingMode:'environment'}, {
      fps:12, qrbox:(w,h)=>{ const size=Math.floor(Math.min(w,h)*0.72); return { width:size, height:size }; }
    }, (decodedText)=>{
      if(State.scanCooldown) return; State.scanCooldown=true;
      handleScannedCode(decodedText.trim());
      if(State.html5Qr){ try{ State.html5Qr.pause(true); }catch(e){} }
      setTimeout(()=>{ State.scanCooldown=false; if(State.html5Qr && State.scanActive){ try{ State.html5Qr.resume(); }catch(e){} } }, 1300);
    }, ()=>{});
  }catch(err){
    toast('เปิดกล้องไม่สำเร็จ กรุณาพิมพ์รหัสแทน'); State.scanActive=false; reader.style.display='none'; btn.textContent='📷 เปิดกล้องสแกน';
  }
}

/* ============ MONTHLY SUMMARY / EXPORT ============
   Orders already live forever in Firestore (one doc per order, indexed by
   date in "codateindex") — there's no built-in monthly limit. This section
   adds a way to roll that up into a month's worth of numbers, export it to
   an .xlsx file, and (optionally) clear the month's orders once you're
   done with them. */
const THAI_MONTHS_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
function fmtMonthTH(monthStr){
  if(!monthStr) return '-';
  const [y,m] = monthStr.split('-').map(Number);
  return THAI_MONTHS_FULL[m-1]+' '+(y+543);
}
function datesInMonth(monthStr){
  return (State.dates||[]).filter(d=>d.startsWith(monthStr)).sort();
}
async function loadOrdersForMonth(monthStr){
  await loadDateIndexC();
  const dates = datesInMonth(monthStr);
  const perDate = await mapWithConcurrency(dates, 4, d=>loadOrdersForDateC(d));
  return { dates, orders: perDate.flat() };
}
function computeMonthSummary(monthStr, dates, orders){
  const totalsByType = {};
  ORDER_TYPES.forEach(t=>totalsByType[t]={count:0, amount:0});
  const itemMap = {}; // code -> {code,name,qty}
  const dayMap = {}; // date -> {count, codTotal, paidTotal, creditTotal, otherTotal}
  dates.forEach(d=>{ dayMap[d] = { date:d, count:0, codTotal:0, paidTotal:0, creditTotal:0, otherTotal:0 }; });
  let totalItemsQty = 0;
  orders.forEach(o=>{
    const t = o.orderType || 'อื่นๆ';
    if(!totalsByType[t]) totalsByType[t] = {count:0, amount:0};
    totalsByType[t].count++;
    totalsByType[t].amount += orderDisplayAmount(o);
    const day = dayMap[o.date] || (dayMap[o.date] = { date:o.date, count:0, codTotal:0, paidTotal:0, creditTotal:0, otherTotal:0 });
    day.count++;
    const amt = orderDisplayAmount(o);
    if(t==='COD') day.codTotal += amt;
    else if(t==='PAID') day.paidTotal += amt;
    else if(t==='CREDIT') day.creditTotal += amt;
    else day.otherTotal += amt;
    (o.items||[]).forEach(it=>{
      const qty = Number(it.qty)||0;
      const key = it.code || ('__noname__'+(it.name||'ไม่ระบุ'));
      if(!itemMap[key]) itemMap[key] = { code: it.code||'-', name: it.name||'(ไม่ระบุชื่อ)', qty:0 };
      itemMap[key].qty += qty;
      totalItemsQty += qty;
    });
  });
  const items = Object.values(itemMap).sort((a,b)=>b.qty-a.qty);
  const byDate = Object.values(dayMap).sort((a,b)=>a.date.localeCompare(b.date));
  return {
    monthStr, dates,
    orderCount: orders.length,
    codTotal: totalsByType['COD'].amount, codCount: totalsByType['COD'].count,
    paidTotal: totalsByType['PAID'].amount, paidCount: totalsByType['PAID'].count,
    creditTotal: totalsByType['CREDIT'].amount, creditCount: totalsByType['CREDIT'].count,
    totalsByType, items, totalItemsQty, byDate
  };
}
async function renderExportTab(){
  await loadDateIndexC();
  const dates = datesInMonth(State.exportMonth);
  document.getElementById('main').innerHTML = `
    <h2 class="section-title">สรุปยอด & Export รายเดือน</h2>
    <div class="card">
      <label>เลือกเดือน</label>
      <input type="month" value="${esc(State.exportMonth)}" onchange="onExportMonthChange(this.value)">
      <div class="muted" style="font-size:12px;margin-top:6px">พบข้อมูล ${dates.length} วันในเดือนนี้ (ข้อมูลเก่าจะยังอยู่ในระบบตลอด จนกว่าจะกดล้างเอง)</div>
      <button class="btn btn-primary" style="margin-top:10px" onclick="doLoadMonthSummary()">🔎 โหลดสรุปเดือน${State.exportSummary?'ใหม่':''}</button>
    </div>
    <div id="export-result">${State.exportSummary ? exportResultHtml(State.exportSummary) : ''}</div>

  State.exportSummary = computeMonthSummary(State.exportMonth, dates, orders);
  document.getElementById('export-result').innerHTML = exportResultHtml(State.exportSummary);

function doExportMonthXlsx(){
  const s = State.exportSummary;
  if(!s){ toast('กรุณาโหลดสรุปเดือนก่อน'); return; }
  const summaryRows = [
    ['เดือน', fmtMonthTH(s.monthStr)],
    ['จำนวนออเดอร์ทั้งหมด', s.orderCount],
    [],
    ['ประเภท','จำนวนออเดอร์','ยอดรวม (บาท)'],
    ['COD', s.codCount, s.codTotal],
    ['PAID', s.paidCount, s.paidTotal],
    ['CREDIT', s.creditCount, s.creditTotal],
  ];
  ORDER_TYPES.filter(t=>!['COD','PAID','CREDIT'].includes(t)).forEach(t=>{
    const row = s.totalsByType[t];
    if(row && row.count>0) summaryRows.push([t, row.count, row.amount]);
  });
  const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
  const dailyRows = [['วันที่','COD (บาท)','PAID (บาท)','CREDIT (บาท)','จำนวนออเดอร์']].concat(
    s.byDate.map(d=>[d.date, d.codTotal, d.paidTotal, d.creditTotal, d.count])
  );
  const wsDaily = XLSX.utils.aoa_to_sheet(dailyRows);
  const itemRows = [['รหัสสินค้า','ชื่อสินค้า','จำนวนที่ขาย (ชิ้น)']].concat(s.items.map(it=>[it.code, it.name, it.qty]));
  itemRows.push([]); itemRows.push(['รวมทั้งหมด','', s.totalItemsQty]);
  const wsItems = XLSX.utils.aoa_to_sheet(itemRows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsSummary, 'สรุปยอด');
  XLSX.utils.book_append_sheet(wb, wsDaily, 'ยอดรายวัน');
  XLSX.utils.book_append_sheet(wb, wsItems, 'สินค้าที่ขาย');
  XLSX.writeFile(wb, 'ChatOrder-สรุป-'+s.monthStr+'.xlsx');
  toast('Export ไฟล์แล้ว');
}

  const s = State.exportSummary;

  showModal(`
    <div class="modal-title">ล้างออเดอร์เดือน ${esc(fmtMonthTH(s.monthStr))}?</div>

    <div class="row"><button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button><button class="btn btn-danger" onclick="doClearMonth()">ลบเลย</button></div>`);

async function doClearMonth(){
  const s = State.exportSummary;
  if(!s){ closeModal(); return; }
  closeModal(); toast('กำลังล้างออเดอร์...');
  for(const d of s.dates){
    const keys = await sList('corder:'+d+':');
    await mapWithConcurrency(keys, 6, k=>sDelete(k));
  }
  const raw = await sGet('codateindex'); let arr=[];
  try{ arr = raw?JSON.parse(raw):[]; }catch(e){ arr=[]; }
  arr = arr.filter(d=>!s.dates.includes(d));
  await sSet('codateindex', JSON.stringify(arr));
  State.exportSummary = null;
  toast('ล้างออเดอร์เดือนนี้เรียบร้อยแล้ว');
  await renderExportTab();
}

/* ============ PRINT LABEL (100mm x 75mm, with QR code of "<date>|<orderId>") ============ */
function renderQrIntoSvg(svgId, text){
  const svgEl = document.getElementById(svgId);
  if(!svgEl || typeof qrcode==='undefined') return;
  try{
    const qr = qrcode(0, 'M');
    qr.addData(text);
    qr.make();
    const n = qr.getModuleCount();
    let rects = '';
    for(let r=0;r<n;r++){
      for(let c=0;c<n;c++){
        if(qr.isDark(r,c)) rects += `<rect x="${c}" y="${r}" width="1" height="1"/>`;
      }
    }
    svgEl.setAttribute('viewBox', `0 0 ${n} ${n}`);
    svgEl.removeAttribute('preserveAspectRatio');
    svgEl.innerHTML = `<rect x="0" y="0" width="${n}" height="${n}" fill="#fff"/><g fill="#000">${rects}</g>`;
  }catch(e){ console.error(e); }
}

/* ============ EXPORT TO EXCEL (replicates his existing daily tracker workbook format) ============ */
function sheetNameForDate(dateStr){
  const [y,m,d] = dateStr.split('-');
  return `${parseInt(d,10)}-${m}-${y.slice(2)}`;
}
async function exportExcel(){
  if(typeof ExcelJS==='undefined'){ toast('โหลดตัวสร้างไฟล์ Excel ไม่สำเร็จ กรุณาลองใหม่'); return; }
  await loadDateIndexC();
  const dates = [...State.dates].sort();
  if(dates.length===0){ toast('ยังไม่มีออเดอร์ให้ส่งออก'); return; }
  toast('กำลังสร้างไฟล์ Excel...');

  const wb = new ExcelJS.Workbook();
  wb.creator = 'ChatOrder'; wb.created = new Date();

  const headerFill = { type:'pattern', pattern:'solid', fgColor:{argb:'FF1F2937'} };
  const headerFont = { name:'Arial', bold:true, color:{argb:'FFFFFFFF'}, size:11 };
  const bodyFont = { name:'Arial', size:10.5, color:{argb:'FF1F2430'} };
  const thin = { style:'thin', color:{argb:'FFD9DCE3'} };
  const borderAll = { top:thin, left:thin, bottom:thin, right:thin };
  const zebra = ['FFFFFFFF','FFF5F6F8'];
  const moneyFmt = '#,##0';

  for(const date of dates){
    const orders = await loadOrdersForDateC(date);
    const sheetName = sheetNameForDate(date);
    const ws = wb.addWorksheet(sheetName, { views:[{ state:'frozen', ySplit:4 }] });
    ws.columns = [
      {width:8.57},{width:20},{width:15},{width:56.57},{width:18},{width:20},{width:16},{width:14},{width:20},{width:18},
      {width:2},{width:12},{width:11},{width:15.85},{width:11}
    ];

    ws.mergeCells('A1:J1');
    const [yy,mm,dd] = date.split('-');
    const c1 = ws.getCell('A1');
    c1.value = `รายการสั่งซื้อและติดตามพัสดุ ${dd}/${mm}/${yy}`;
    c1.font = { name:'Arial', bold:true, size:14, color:{argb:'FF1F2430'} };
    ws.getRow(1).height = 30;

    ws.mergeCells('A2:J2');
    const c2 = ws.getCell('A2');
    c2.value = 'คลิกที่เซลล์ในคอลัมน์ "รูปแบบคำสั่งซื้อ" หรือ "สถานะ" แล้วเลือกจากลิสต์ดรอปดาวน์เพื่อเปลี่ยนค่าได้ทันที  |  Gift = ให้ของขวัญ, RS = ส่งอีกรอบ';
    c2.font = { name:'Arial', size:9, italic:true, color:{argb:'FF5B6672'} };
    ws.getRow(2).height = 14;
    ws.getRow(3).height = 4;

    const headers = ['No','ชื่อลูกค้า','เบอร์โทร','ที่อยู่','รูปแบบคำสั่งซื้อ','ยอดเก็บปลายทาง (COD)','ยอดชำระ/เครดิต','ขนส่ง','เลข Tracking','สถานะ'];
    const headerRow = ws.getRow(4);
    headers.forEach((h,i)=>{
      const cell = headerRow.getCell(i+1);
      cell.value = h; cell.font = headerFont; cell.fill = headerFill;
      cell.alignment = { horizontal:'center', vertical:'center', wrapText:true };
      cell.border = borderAll;
    });
    headerRow.height = 30;

    orders.forEach((o,idx)=>{
      const r = 5+idx;
      const row = ws.getRow(r);
      row.height = 30;
      const codVal = o.orderType==='COD' ? (o.codAmount!=null?o.codAmount:orderItemsTotal(o.items)) : null;
      const paidVal = (o.orderType==='PAID'||o.orderType==='CREDIT') ? (o.paidAmount!=null?o.paidAmount:orderItemsTotal(o.items)) : null;
      const vals = [o.orderId, o.customer, o.phone, o.address, o.orderType, codVal, paidVal, o.shipping, o.tracking?String(o.tracking):null, o.status];
      vals.forEach((v,i)=>{
        const cell = row.getCell(i+1);
        cell.value = (v===undefined) ? null : v;
        cell.font = bodyFont;
        cell.alignment = { horizontal:(i===1||i===3)?'left':'center', vertical:'center', wrapText:(i===3) };
        cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb: zebra[idx%2]} };
        cell.border = borderAll;
        if(i===5 || i===6) cell.numFmt = moneyFmt;
      });
    });

    const validationLastRow = Math.max(5+orders.length+50, 200);
    for(let r=5;r<=validationLastRow;r++){
      ws.getCell('E'+r).dataValidation = { type:'list', allowBlank:true, formulae:[`"${ORDER_TYPES.join(',')}"`] };
      ws.getCell('H'+r).dataValidation = { type:'list', allowBlank:true, formulae:[`"${SHIPPING_LIST.join(',')}"`] };
      ws.getCell('J'+r).dataValidation = { type:'list', allowBlank:true, formulae:[`"${STATUS_LIST.join(',')}"`] };
    }

    const countRange = Math.max(validationLastRow, 1000);
    SHIPPING_LIST.forEach((s,i)=>{
      const r = 5+i;
      ws.getCell('L'+r).value = s; ws.getCell('L'+r).font = bodyFont;
      ws.getCell('M'+r).value = { formula: `COUNTIF(H5:H${countRange},"${s}")` };
      ws.getCell('M'+r).font = bodyFont;
    });
    STATUS_LIST.forEach((s,i)=>{
      const r = 5+i;
      ws.getCell('N'+r).value = s; ws.getCell('N'+r).font = bodyFont;
      ws.getCell('O'+r).value = { formula: `COUNTIF(J5:J${countRange},"${s}")` };
      ws.getCell('O'+r).font = bodyFont;
    });
  }

  const dash = wb.addWorksheet('Dashboard');
  dash.columns = [{width:14},{width:12},{width:12},{width:12},{width:12},{width:10},{width:10},{width:10},{width:10},{width:10}];
  dash.getCell('A1').value = 'Dashboard สรุปยอด COD / PAID / CREDIT';
  dash.getCell('A1').font = { name:'Arial', bold:true, size:14 };
  dash.getRow(1).height = 26;
  dash.getCell('A3').value = `ข้อมูลคำสั่งซื้อรายวัน ${fmtDateTH(dates[0])} - ${fmtDateTH(dates[dates.length-1])}`;
  dash.getCell('A3').font = { name:'Arial', italic:true, size:10, color:{argb:'FF5B6672'} };

  dash.getCell('A5').value='รวม COD'; dash.getCell('D5').value='รวม PAID'; dash.getCell('G5').value='รวม CREDIT'; dash.getCell('J5').value='รวมทั้งหมด';
  ['A5','D5','G5','J5'].forEach(a=>{ dash.getCell(a).font = { name:'Arial', bold:true, size:11 }; });

  ['A11','B11','C11','D11','E11'].forEach((a,i)=>{
    const labels=['วันที่','COD','PAID','CREDIT','รวม'];
    const cell = dash.getCell(a);
    cell.value = labels[i]; cell.font = headerFont; cell.fill = headerFill; cell.alignment = { horizontal:'center' };
  });

  dates.forEach((date,i)=>{
    const r = 12+i;
    const sn = sheetNameForDate(date);
    dash.getCell('A'+r).value = fmtDateSlash(date);
    dash.getCell('B'+r).value = { formula:`SUMIF('${sn}'!E:E,"COD",'${sn}'!F:F)` };
    dash.getCell('C'+r).value = { formula:`SUMIF('${sn}'!E:E,"PAID",'${sn}'!G:G)` };
    dash.getCell('D'+r).value = { formula:`SUMIF('${sn}'!E:E,"CREDIT",'${sn}'!G:G)` };
    dash.getCell('E'+r).value = { formula:`SUM(B${r}:D${r})` };
    ['B'+r,'C'+r,'D'+r,'E'+r].forEach(a=>dash.getCell(a).numFmt = moneyFmt);
  });
  const totalRow = 12+dates.length;
  dash.getCell('A'+totalRow).value = 'รวมทั้งหมด';
  dash.getCell('A'+totalRow).font = { bold:true };
  dash.getCell('B'+totalRow).value = { formula:`SUM(B12:B${totalRow-1})` };
  dash.getCell('C'+totalRow).value = { formula:`SUM(C12:C${totalRow-1})` };
  dash.getCell('D'+totalRow).value = { formula:`SUM(D12:D${totalRow-1})` };
  dash.getCell('E'+totalRow).value = { formula:`SUM(E12:E${totalRow-1})` };
  ['B','C','D','E'].forEach(col=>{ const cell=dash.getCell(col+totalRow); cell.numFmt=moneyFmt; cell.font={bold:true}; });

  dash.getCell('A6').value = { formula:`B${totalRow}` };
  dash.getCell('D6').value = { formula:`C${totalRow}` };
  dash.getCell('G6').value = { formula:`D${totalRow}` };
  dash.getCell('J6').value = { formula:`E${totalRow}` };
  ['A6','D6','G6','J6'].forEach(a=>{ const cell=dash.getCell(a); cell.font={name:'Arial',bold:true,size:16,color:{argb:'FFE08A00'}}; cell.numFmt=moneyFmt; });

  const buf = await wb.xlsx.writeBuffer();
  const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'Order_ส่งของและติดตาม_'+todayStr()+'.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  toast('ส่งออกไฟล์ Excel สำเร็จ ('+dates.length+' วัน)');
}

(async function init(){
  loadStaffName();
  if(!State.staffName) openStaffModal();
  await refreshCatalog();
  await render();
})();
</script>
